#pcv{position:absolute;inset:0}

body.ui header,body.ui #bottom{opacity:1;pointer-events:auto}
header{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:14px;align-items:center;padding:6px 14px;border-radius:6px;min-height:52px}

button.on{background:rgba(0,229,255,.3);border-color:var(--c);color:#fff}button:active{background:rgba(0,229,255,.4)}

#panel{top:76px;right:8px;width:min(320px,42vw);padding:14px 16px;border-radius:6px;display:none}body.ui #panel.on{display:block;opacity:1;pointer-events:auto}
#panel h2{margin:0 0 4px;font-size:18px;color:var(--c);letter-spacing:.08em}#panel p{margin:0 0 10px;color:#9cc3d2;font-size:14px}

#close{position:absolute;top:6px;right:6px;min-height:36px;width:36px;padding:0}
